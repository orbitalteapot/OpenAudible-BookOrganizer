name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release and tag (e.g. 1.2.3, or 1.2.3-beta.1 for a pre-release)'
        required: true
        type: string
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  # ── Build and test before anything is tagged or published ────────────────────
  # First, deliberately: tagging ahead of the tests meant a failed release still left its tag
  # behind, and re-running the same version then failed with "tag already exists".
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron-ui/package-lock.json

      - name: Run backend tests
        run: dotnet test OpenAudibleBookManager.sln -c Release

      - name: Install frontend dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Run frontend tests
        working-directory: electron-ui
        run: npm test

  # ── Create tag (only when triggered manually) ─────────────────────────────────
  create-tag:
    name: Create release tag ${{ inputs.version }}
    needs: [verify]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Error: version must be X.Y.Z or X.Y.Z-<pre-release> (e.g. 1.2.3, 1.2.3-beta.1)"
            exit 1
          fi

      - name: Create and push tag
        run: |
          VERSION="${{ inputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null 2>&1; then
            echo "Error: tag ${VERSION} already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

  # ── Resolve version (single source of truth for all build jobs) ──────────────
  resolve-version:
    name: Resolve release version
    needs: [verify, create-tag]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.actor != 'github-actions[bot]')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Compute version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Error: release tag must be X.Y.Z or X.Y.Z-<pre-release> (for example 1.2.3, 1.2.3-beta.1)"
            exit 1
          fi

          # 1.2.3-beta.1 is a pre-release: it is published, but it must not become the version
          # that 'latest' or the X.Y Docker tag point at.
          CORE="${VERSION%%-*}"
          if [ "$CORE" != "$VERSION" ]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=${CORE%.*}" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION (pre-release: $IS_PRERELEASE)"

  # ── Windows x64 NSIS installer ───────────────────────────────────────────────
  build-windows:
    name: Windows x64 installer
    needs: [resolve-version, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set app version from tag
        shell: bash
        run: |
          cd electron-ui
          npm version "${{ needs.resolve-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install npm dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Build Windows installer
        working-directory: electron-ui
        run: npm run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: electron-ui/release/*.exe

  # ── Linux x64 installers (AppImage + deb) ───────────────────────────────────
  build-linux:
    name: Linux x64 installers
    needs: [resolve-version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set app version from tag
        run: |
          cd electron-ui
          npm version "${{ needs.resolve-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install npm dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Build Linux installers
        working-directory: electron-ui
        run: |
          npm run publish:backend:linux
          npm run build
          npx electron-builder --publish never --linux AppImage deb --x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            electron-ui/release/*.AppImage
            electron-ui/release/*.deb

  # ── macOS x64 installer (dmg) ────────────────────────────────────────────────
  build-mac-x64:
    name: macOS x64 installer
    needs: [resolve-version, verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set app version from tag
        run: |
          cd electron-ui
          npm version "${{ needs.resolve-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install npm dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Build macOS x64 installer
        working-directory: electron-ui
        env:
          # Skip code-signing for unsigned CI builds
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run publish:backend:mac
          npm run build
          npx electron-builder --publish never --mac dmg --x64

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-installer
          path: electron-ui/release/*.dmg

  # ── macOS arm64 installer (dmg) ──────────────────────────────────────────────
  build-mac-arm64:
    name: macOS arm64 installer
    needs: [resolve-version, verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set app version from tag
        run: |
          cd electron-ui
          npm version "${{ needs.resolve-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install npm dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Build macOS arm64 installer
        working-directory: electron-ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run publish:backend:mac-arm
          npm run build
          npx electron-builder --publish never --mac dmg --arm64

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-installer
          path: electron-ui/release/*.dmg

  # ── Docker image → ghcr.io ───────────────────────────────────────────────────
  build-docker:
    name: Docker image (Web App)
    needs: [resolve-version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Spelled out in lower case rather than reusing the repository name: GHCR requires
          # lower case, and leaving the folding implicit is what let the README document a
          # pull command ("openaudible-book-organizer") that never matched what was published.
          images: ghcr.io/${{ github.repository_owner }}/openaudible-bookorganizer
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # A pre-release is published under its exact version only: 'latest' and the X.Y tag
          # must keep pointing at the last stable release.
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=${{ needs.resolve-version.outputs.major_minor }},enable=${{ needs.resolve-version.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.resolve-version.outputs.is_prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ManagerApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── GitHub Release with all artifacts ─────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs:
      - resolve-version
      - build-windows
      - build-linux
      - build-mac-x64
      - build-mac-arm64
      - build-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Choose release notes
        id: notes
        run: |
          if [ "${{ needs.resolve-version.outputs.is_prerelease }}" == "true" ] && [ -f .github/release-body-beta.md ]; then
            echo "path=.github/release-body-beta.md" >> $GITHUB_OUTPUT
          else
            echo "path=.github/release-body.md" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: OpenAudible Book Organizer ${{ needs.resolve-version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ needs.resolve-version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/linux-installers/*.AppImage
            artifacts/linux-installers/*.deb
            artifacts/macos-x64-installer/*.dmg
            artifacts/macos-arm64-installer/*.dmg
