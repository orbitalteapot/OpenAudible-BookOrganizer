services:
  book-organizer-web:
    build:
      context: .
      dockerfile: ManagerApi/Dockerfile
    environment:
      # The three paths are fixed by these variables: the Sort page shows them, with whether each
      # was found, but cannot change them. The startup log (docker logs) lists them too.
      # Path inside the container where the OpenAudible CSV export is mounted
      CSV_PATH: /data/books.csv
      # Path inside the container where source audiobook files are mounted
      SOURCE_PATH: /source
      # Path inside the container where sorted books are written. It must already exist: sorts
      # never create it here, so a forgotten mount or an unmounted drive is reported instead of
      # the library being copied into the container.
      DESTINATION_PATH: /destination
      # Update check used until one is chosen on the Sort page: "quick" (size and sampled contents)
      # or "full" (every byte). The page's choice is saved in /data/settings.json and wins after that.
      COMPARISON_MODE: quick
      # Sort automatically: "6h", "12h", "1d", ... (at least 15 minutes). This fixes the schedule;
      # the Sort page shows it but cannot change it. Leave it out, or use "off", to choose automatic
      # sorting on the Sort page instead. A value that cannot be read is ignored, with a warning on
      # the Sort page.
      # SORT_INTERVAL: 6h
      # Books copied at once at the "Normal" copy speed (the default depends on the CPU). The Sort
      # page's "Gentle" copy speed always copies one book at a time.
      # OABO_MAX_PARALLELISM: 2
    ports:
      - "5123:5123"
    volumes:
      # Place your OpenAudible CSV export (books.csv) in a local ./data folder. The choices made on
      # the Sort page, and when automatic sorting last ran, are kept here too (settings.json), so
      # they survive a restart or a new image.
      - ./data:/data
      # Replace the left-hand side with your actual audiobook source directory. It is only read.
      # Without this line the Sort page shows the source folder as not found inside the container.
      - /path/to/your/audiobooks:/source
      # Replace the left-hand side with the directory you want books sorted into. Without this line
      # nothing is sorted: the Sort page shows the destination folder as not found, rather than
      # copying the library somewhere inside the container where it would be lost.
      - /path/to/your/organized:/destination
    restart: unless-stopped
